[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cms-wm-core"
version = "0.1.5"
description = "Core libraries for the future CMS Workload Management System"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "CMS Workload Management" },
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cms_wm_core"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
